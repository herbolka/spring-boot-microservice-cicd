apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: currency-conversion-hpa
  namespace: production
  labels:
    app: currency-conversion
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: currency-conversion-service
  
  minReplicas: 2
  maxReplicas: 10
  
  # Metrics-based scaling
  metrics:
  
  # CPU-based scaling: Scale up at 70% utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  
  # Memory-based scaling: Scale up at 80% utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  
  # Scaling behavior configuration
  behavior:
    
    # Scale UP behavior
    scaleUp:
      stabilizationWindowSeconds: 60    # Wait 60s before scaling up
      policies:
      - type: Percent
        value: 100                       # Double the pods (100% increase)
        periodSeconds: 30                # Every 30 seconds
      - type: Pods
        value: 2                         # Or add 2 pods
        periodSeconds: 60                # Every 60 seconds
      selectPolicy: Max                  # Use the policy that scales up most
    
    # Scale DOWN behavior (more conservative)
    scaleDown:
      stabilizationWindowSeconds: 300   # Wait 5 minutes before scaling down
      policies:
      - type: Percent
        value: 50                        # Remove 50% of pods
        periodSeconds: 60                # Every 60 seconds
      selectPolicy: Min                  # Use the policy that scales down least